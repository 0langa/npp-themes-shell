name: NppThemes Shell CI

on:
  push:
    branches: [shell/main]
  pull_request:
    branches: [shell/main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  theme-contract:
    name: Theme contract and service tests
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Configure tests
        run: cmake -S PowerEditor/Test/NppThemes -B out/theme-tests -A x64
      - name: Build tests
        run: cmake --build out/theme-tests --config Release --parallel
      - name: Run tests
        run: ctest --test-dir out/theme-tests -C Release --output-on-failure

  shell-build:
    name: Release ${{ matrix.platform }} compile
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, Win32, ARM64]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3
      - name: Compile Shell
        run: msbuild PowerEditor/visual.net/notepadPlus.sln /m /p:Configuration=Release /p:Platform=${{ matrix.platform }} /v:minimal
